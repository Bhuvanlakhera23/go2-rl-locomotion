<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Blind actor and training-only asymmetric critic</title><desc id="desc">Proprioception and commands feed temporal context, then actor, joint targets and robot. Privileged training signals feed a critic. This is a conceptual diagram, not implementation code.</desc><rect width="960" height="350" rx="20" fill="#0d1524"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3ce0c0"/></marker></defs><g font-family="Arial, sans-serif" fill="#ecf5ff"><text x="36" y="42" font-size="22" font-weight="bold">Blind at inference. Privileged during training.</text><text x="36" y="68" font-size="14" fill="#a7b9cd">High-level architecture · no terrain-height map enters the actor</text><rect x="35" y="110" width="200" height="82" rx="12" fill="#19283c" stroke="#35516e"/><text x="135.0" y="143" text-anchor="middle" font-size="17">Proprioception</text><text x="135.0" y="168" text-anchor="middle" font-size="13" fill="#a7b9cd">+ velocity commands</text><rect x="270" y="110" width="180" height="82" rx="12" fill="#19283c" stroke="#35516e"/><text x="360.0" y="143" text-anchor="middle" font-size="17">Temporal context</text><text x="360.0" y="168" text-anchor="middle" font-size="13" fill="#a7b9cd">recent motion history</text><rect x="490" y="110" width="150" height="82" rx="12" fill="#19283c" stroke="#35516e"/><text x="565.0" y="143" text-anchor="middle" font-size="17">Policy actor</text><text x="565.0" y="168" text-anchor="middle" font-size="13" fill="#a7b9cd">joint residuals</text><rect x="680" y="110" width="240" height="82" rx="12" fill="#19283c" stroke="#35516e"/><text x="800.0" y="143" text-anchor="middle" font-size="17">Joint targets → robot</text><text x="800.0" y="168" text-anchor="middle" font-size="13" fill="#a7b9cd">closed-loop feedback</text><path d="M239 151 H264" stroke="#3ce0c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M454 151 H484" stroke="#3ce0c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M644 151 H674" stroke="#3ce0c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 194 V219 H135 V195" stroke="#3ce0c0" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="270" y="253" width="370" height="62" rx="12" fill="#2c2634" stroke="#d0a354" stroke-dasharray="6 4"/><text x="455" y="279" text-anchor="middle" font-size="16">Privileged critic · training only</text><text x="455" y="300" text-anchor="middle" font-size="12" fill="#d5c6ac">PPO value learning; excluded from deployed actor inputs</text></g></svg>